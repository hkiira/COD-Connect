name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to aaPanel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PHP_BIN: ${{ secrets.DEPLOY_PHP_BIN }}
          DEPLOY_COMPOSER_BIN: ${{ secrets.DEPLOY_COMPOSER_BIN }}
          DEPLOY_NPM_BUILD: ${{ secrets.DEPLOY_NPM_BUILD }}
        run: |
          set -Eeuo pipefail

          : "${DEPLOY_HOST:?Missing GitHub secret DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing GitHub secret DEPLOY_USER}"
          : "${DEPLOY_KEY:?Missing GitHub secret DEPLOY_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing GitHub secret DEPLOY_KNOWN_HOSTS}"
          : "${DEPLOY_PATH:?Missing GitHub secret DEPLOY_PATH}"

          deploy_port="${DEPLOY_PORT:-22}"
          key_file="$RUNNER_TEMP/codconnect-deploy-key"
          known_hosts_file="$RUNNER_TEMP/codconnect-known-hosts"

          # Keep the private key and host keys out of the repository and verify
          # the server identity instead of accepting an unknown host key.
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$known_hosts_file"
          chmod 600 "$key_file"
          chmod 644 "$known_hosts_file"

          ssh_options=(
            -i "$key_file"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_file"
            -o ConnectTimeout=15
          )

          # printf %q safely quotes paths before they are interpreted by the
          # remote shell. The remote script receives no GitHub token or app
          # environment values.
          remote_env="DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH")"
          remote_env+=" DEPLOY_BRANCH=main"
          remote_env+=" DEPLOY_PHP_BIN=$(printf '%q' "${DEPLOY_PHP_BIN:-}")"
          remote_env+=" DEPLOY_COMPOSER_BIN=$(printf '%q' "${DEPLOY_COMPOSER_BIN:-}")"
          remote_env+=" DEPLOY_NPM_BUILD=$(printf '%q' "${DEPLOY_NPM_BUILD:-false}")"

          ssh "${ssh_options[@]}" \
            -p "$deploy_port" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_env bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          : "${DEPLOY_BRANCH:?DEPLOY_BRANCH is required}"

          PHP_BIN="${DEPLOY_PHP_BIN:-php}"

          if [[ "$PHP_BIN" == */* ]]; then
            [[ -x "$PHP_BIN" ]] || {
              echo "PHP binary is not executable: $PHP_BIN" >&2
              exit 1
            }
          else
            command -v "$PHP_BIN" >/dev/null 2>&1 || {
              echo "PHP binary was not found: $PHP_BIN" >&2
              exit 1
            }
          fi

          # Let Composer's /usr/bin/env php shebang resolve to the same PHP
          # version when aaPanel has multiple PHP versions installed.
          if [[ "$PHP_BIN" == */* ]]; then
              export PATH="$(dirname "$PHP_BIN"):$PATH"
          fi

          "$PHP_BIN" -r '
              if (version_compare(PHP_VERSION, "8.3.0", "<")) {
                  fwrite(STDERR, "PHP 8.3 or newer is required; found " . PHP_VERSION . PHP_EOL);
                  exit(1);
              }
          '

          [[ -d "$DEPLOY_PATH" ]] || {
            echo "Deployment directory does not exist: $DEPLOY_PATH" >&2
            exit 1
          }

          cd "$DEPLOY_PATH"

          [[ -d .git ]] || {
            echo "The deployment directory is not a Git checkout: $DEPLOY_PATH" >&2
            echo "Clone the repository there first and configure its origin remote." >&2
            exit 1
          }

          # Do not overwrite manual changes made on the server. The .env,
          # storage and other ignored runtime files remain untouched.
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "Tracked local changes detected; deployment aborted:" >&2
            git status --short >&2
            exit 1
          fi

          git fetch --prune origin "$DEPLOY_BRANCH"

          if git show-ref --verify --quiet "refs/heads/$DEPLOY_BRANCH"; then
            git checkout --quiet "$DEPLOY_BRANCH"
          else
            git checkout --quiet -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
          fi

          # Fast-forward only: this applies the GitHub commit without deleting
          # server-only untracked files such as .env and uploaded storage.
          git merge --ff-only "origin/$DEPLOY_BRANCH"

          run_composer() {
              if [[ -n "${DEPLOY_COMPOSER_BIN:-}" ]]; then
                  "$DEPLOY_COMPOSER_BIN" "$@"
              elif command -v composer >/dev/null 2>&1; then
                  composer "$@"
              elif [[ -f /www/server/composer/composer.phar ]]; then
                  "$PHP_BIN" /www/server/composer/composer.phar "$@"
              elif [[ -f "$DEPLOY_PATH/composer.phar" ]]; then
                  "$PHP_BIN" "$DEPLOY_PATH/composer.phar" "$@"
              else
                  echo "Composer was not found. Set DEPLOY_COMPOSER_BIN or install Composer on aaPanel." >&2
                  exit 1
              fi
          }

          run_composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --no-progress \
              --optimize-autoloader

          if [[ "${DEPLOY_NPM_BUILD:-false}" == "true" ]]; then
              command -v npm >/dev/null 2>&1 || {
                  echo "DEPLOY_NPM_BUILD=true but npm was not found on the server." >&2
                  exit 1
              }

              if [[ -f package-lock.json ]]; then
                  npm ci --no-audit --no-fund
              else
                  npm install --no-audit --no-fund
              fi
              npm run build
          fi

          "$PHP_BIN" artisan optimize:clear
          "$PHP_BIN" artisan migrate --force

          if [[ ! -e public/storage ]]; then
              "$PHP_BIN" artisan storage:link
          fi

          "$PHP_BIN" artisan optimize
          "$PHP_BIN" artisan queue:restart

          echo "Deployed commit: $(git rev-parse --short HEAD)"
          REMOTE_SCRIPT
